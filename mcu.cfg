# mcu.cfg - BOARD-SPECIFIC configuration
# Current board: Creality Ender-3 V3 SE stock silent mainboard
#   PCBA_G_Ender-3V3 SE_CR4NS200320C14_M4_32_GD303RET6
#   MCU: GigaDevice GD32F303RET6 (STM32F103-compatible)
#
# SOURCE: Verified against community config (166 stars, actively maintained):
# https://github.com/0xD34D/ender3-v3-se-klipper-config
# That repo explicitly confirms: "This also works for the GD32F303 based
# Creality 4.2.2 board" - which matches this exact board.
#
# FIRMWARE BUILD (make menuconfig):
#   - Micro-controller: STM32F103
#   - Bootloader offset: 28KiB bootloader
#   - Communication: Serial (on USART1 PA10/PA9)
#
# FLASHING METHOD (IMPORTANT - different from USB/DFU):
#   1. Copy out/klipper.bin to a FAT32-formatted SD card
#   2. Insert SD card into printer, power on
#   3. Filename must end in .bin and differ from the last flashed filename
#      (e.g. increment a version number each time you reflash)
#
# STILL TO VERIFY once board is physically in hand:
#   - [mcu] serial: path -> run: ls /dev/serial/by-id/*
#   - Confirm your board revision matches this pinout exactly
#     (Creality has minor pin variations across production runs)

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

#####################################################################
#   X/Y/Z Stepper pins (verified against community config)
#####################################################################

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
endstop_pin: ~!PA5

[tmc2208 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
endstop_pin: ~!PA6

[tmc2208 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
endstop_pin: probe:z_virtual_endstop

[tmc2208 stepper_z]
uart_pin: PB14
run_current: 0.80
sense_resistor: 0.150
interpolate: True

#####################################################################
#   Extruder pins (Sprite direct drive) - verified
#####################################################################

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
heater_pin: PA1
sensor_pin: PC5

#####################################################################
#   Bed heater pins - verified
#####################################################################

[heater_bed]
heater_pin: PB2
sensor_pin: PC4

#####################################################################
#   CR Touch pins - verified
#####################################################################

[bltouch]
sensor_pin: ^PC14
control_pin: PC13

#####################################################################
#   Fan pins - verified
#####################################################################

[fan]
pin: PA0

[heater_fan hotend_fan]
pin: PC1
heater: extruder
heater_temp: 50.0

#####################################################################
#   Beeper (present on this board, not in my original draft)
#####################################################################

[output_pin beeper]
pin: PB0

