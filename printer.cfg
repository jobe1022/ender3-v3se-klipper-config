# printer.cfg - BOARD-INDEPENDENT configuration for Ender 3 V3 SE
# This file should stay stable across mainboard swaps.
# Board-specific pins live in mcu.cfg (see [include] below).

[include mcu.cfg]
[include mainsail.cfg]
[include timelapse.cfg]
[include macros.cfg]
#####################################################################
#   General printer / kinematics
#####################################################################

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 4000
max_z_velocity: 5
max_z_accel: 100
#square_corner_velocity: 8.0
square_corner_velocity: 8.0

#####################################################################
#   Input Shapper
#####################################################################

[input_shaper]
shaper_freq_x: 83.2
shaper_type_x: 2hump_ei
shaper_freq_y: 43.8
shaper_type_y: mzv

#####################################################################
#   Stepper motion parameters (non-pin settings)
#   Pin definitions for these steppers live in mcu.cfg
#####################################################################

[stepper_x]
microsteps: 16
rotation_distance: 40
position_endstop: -6
position_min: -6
position_max: 220
homing_speed: 80

[stepper_y]
microsteps: 16
rotation_distance: 40
position_endstop: -14
position_min: -14
position_max: 220
homing_speed: 80

[stepper_z]
microsteps: 16
rotation_distance: 8
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

#####################################################################
#   Extruder physical parameters (Sprite direct drive)
#####################################################################

[extruder]
microsteps: 16
rotation_distance: 7.532
nozzle_diameter: 0.400
filament_diameter: 1.750
sensor_type: EPCOS 100K B57560G104F
#control: pid
# Real values from PID_CALIBRATE run at actual 222C target on Klipper
#pid_Kp: 27.046
#pid_Ki: 1.541
#pid_Kd: 118.664
min_temp: 0
max_temp: 300
max_extrude_only_distance: 100
#pressure_advance: 0.126
pressure_advance: 0.09
pressure_advance_smooth_time: 0.040

#####################################################################
#   Bed heater physical parameters
#####################################################################

[heater_bed]
sensor_type: EPCOS 100K B57560G104F
control: pid
# Real values from PID_CALIBRATE run at actual 60C target on Klipper
pid_Kp: 65.590
pid_Ki: 0.706
pid_Kd: 1522.518
min_temp: 0
max_temp: 110

#####################################################################
#   CR Touch (BLTouch) probe offsets + homing
#####################################################################

[bltouch]
x_offset: -24.25
y_offset: -15.00
#z_offset: -1.063   # placeholder - run PRTOUCH_PROBE_ZOFFSET to auto-calibrate this
speed: 20
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True

#####################################################################
#   PRTouch - load cell based auto Z-offset calibration
#   Works alongside BLTouch above: BLTouch still handles homing/
#   probing/bed mesh via probe:z_virtual_endstop. PRTouch uses the
#   under-bed load cell (HX711 ADC) to automatically set z_offset
#   without a manual paper test - run PRTOUCH_PROBE_ZOFFSET to use it.
#####################################################################

[filter]

[dirzctl]

[hx711s]
sensor0_clk_pin: PA4
sensor0_sdo_pin: PC6

[prtouch]
sensor_x: 32
sensor_y: 30
clr_noz_start_x: 15
clr_noz_start_y: 25
clr_noz_len_y: 15
s_hot_min_temp: 160
s_hot_max_temp: 200
s_bed_max_temp: 60
show_msg: False
wipe_retract_distance: 2

[safe_z_home]
home_xy_position: 110, 110
speed: 150
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 195.75, 205
probe_count: 5, 5
algorithm: bicubic
[idle_timeout]
timeout: 18000

# screws_tilt_adjust intentionally omitted: stock V3 SE bed is fixed
# with no manual leveling knobs. CR Touch + bed_mesh below handles all
# bed-unevenness compensation automatically instead.

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    117, 117, 20

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}
    G28
    BED_MESH_CALIBRATE
    M109 S{EXTRUDER_TEMP}
    G92 E0
    G1 Z2.0 F3000
    G1 X2 Y20 Z0.28 F5000.0
    G1 X2 Y200.0 Z0.28 F1500.0 E15
    G1 X4 Y200.0 Z0.28 F5000.0
    G1 X4 Y20 Z0.28 F1500.0 E30
    G1 E29 F1800
    G92 E0

[gcode_macro PRINT_END]
gcode:
    M400
    G92 E0
    G1 E-2 F1800
    G91
    G1 Z25.00 F600
    G90
    G1 X110 Y210 F3600
    M106 S0
    M104 S0
    M140 S0
    M84 X Y E

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[e3v3se_display]
language: english
logging: True

[mcu accelerometer]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434041046C11C-if00

[adxl345]
cs_pin: accelerometer:gpio9
spi_bus: spi1_gpio8_gpio11_gpio10
axes_map: -x,-y,-z

[resonance_tester]
accel_chip: adxl345
probe_points:
    100, 100, 20


