[gcode_macro CALIBRATE_MESH_PLA]
gcode:
    {% set BED_TEMP = 60 %}
    
    ; Heat the bed and wait for full stabilization
    M140 S{BED_TEMP}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1} MAXIMUM={BED_TEMP + 1}
    G4 P180000  ; extra 3 min dwell for full thermal expansion/settling
    
    ; Kill heater PWM noise before probing
    TURN_OFF_HEATERS
    
    ; Home before any probing
    G28
    
    ; Run bed mesh at hot-stabilized, heater-off state
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE LOAD=default
    
    RESPOND MSG="PLA bed mesh calibration complete and loaded (60C)"

[gcode_macro CALIBRATE_ZOFFSET_PLA]
gcode:
    {% set BED_TEMP = 60 %}
    
    ; Heat the bed and wait for full stabilization
    M140 S{BED_TEMP}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1} MAXIMUM={BED_TEMP + 1}
    G4 P180000  ; extra 3 min dwell for full thermal expansion/settling
    
    ; Kill heater PWM noise before probing
    TURN_OFF_HEATERS
    
    ; Home before any probing
    G28
    
    ; Check measurement consistency before trusting the offset
    PRTOUCH_ACCURACY
    
    ; Run the actual offset probe
    PRTOUCH_PROBE_ZOFFSET
    
    RESPOND MSG="PLA Z-offset probe complete (60C) - check PRTOUCH_ACCURACY std dev above before trusting this reading, then SAVE_CONFIG if good"

